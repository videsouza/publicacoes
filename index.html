<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema - Nova Versão</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .hub-container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            text-align: center;
            border-top: 5px solid #0d47a1; /* Azul Principal */
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #0d47a1;
            margin-bottom: 10px;
        }

        p {
            color: #64748b;
            margin-bottom: 30px;
        }

        button {
            background-color: #1565c0;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #0a3d91;
        }

        #resultado {
            margin-top: 20px;
            padding: 15px;
            background-color: #e3f2fd;
            color: #0d47a1;
            border-radius: 6px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="hub-container">
        <h1>Sistema Inicializado</h1>
        <p>A fundação está limpa e pronta para receber as novas funcionalidades.</p>
        
        <button onclick="testarConexao()">Testar Conexão com o Python</button>
        
        <div id="resultado"></div>
    </div>

    <script>
        async function testarConexao() {
            const divResultado = document.getElementById('resultado');
            divResultado.style.display = 'block';
            divResultado.innerText = "Conectando...";

            try {
                const resposta = await fetch('/api/status');
                const dados = await resposta.json();
                divResultado.innerText = `Sucesso: ${dados.status} (Versão ${dados.versao})`;
            } catch (erro) {
                divResultado.style.backgroundColor = '#fee2e2';
                divResultado.style.color = '#b91c1c';
                divResultado.innerText = "Erro ao conectar com o servidor.";
            }
        }
    </script>
</body>
</html>
